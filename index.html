```html
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f7f7f7;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #countdown {
        position: fixed;
        top: 15px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 38px;
        font-weight: bold;
        z-index: 10;
    }

    #game-container {
        position: fixed;
        top: 80px;
        left: 5%;
        width: 90%;
        height: calc(100vh - 100px);
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    #game {
        width: 100%;
        height: 100%;
        border: none;
    }

    #final-image {
        display: none;

        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        background: black;

        justify-content: center;
        align-items: center;

        z-index: 100;
    }

    #final-image img {
        max-width: 100%;
        max-height: 100%;

        object-fit: contain;
    }
</style>
</head>

<body>

<div id="countdown">
    00:00:00
</div>

<div id="game-container">

    <iframe
        id="game"
        src="https://typeling1578.github.io/dino-game/"
        allow="fullscreen">
    </iframe>

</div>

<div id="final-image">

    <img
        src="immagine.jpg"
        alt="Immagine finale">

</div>

<script>

/* =================================
   DATA E ORA DELLA SORPRESA
   ================================= */

const dataFinale = "2026-09-08T22:00:00+02:00";


/* =================================
   ELEMENTI
   ================================= */

const countdown = document.getElementById("countdown");
const gameContainer = document.getElementById("game-container");
const finalImage = document.getElementById("final-image");


/* =================================
   DATA FINALE
   ================================= */

const target = new Date(dataFinale).getTime();


/* =================================
   FUNZIONE COUNTDOWN
   ================================= */

function aggiornaCountdown() {

    const adesso = Date.now();
    const differenza = target - adesso;


    /* Quando arriva l'ora */

    if (differenza <= 0) {

        countdown.style.display = "none";

        gameContainer.style.display = "none";

        finalImage.style.display = "flex";

        return;
    }


    /* Calcolo tempo */

    const ore = Math.floor(
        differenza / 3600000
    );

    const minuti = Math.floor(
        (differenza % 3600000) / 60000
    );

    const secondi = Math.floor(
        (differenza % 60000) / 1000
    );


    /* Visualizzazione */

    countdown.textContent =
        String(ore).padStart(2, "0") + ":" +
        String(minuti).padStart(2, "0") + ":" +
        String(secondi).padStart(2, "0");
}


/* =================================
   AVVIO
   ================================= */

aggiornaCountdown();

const timer = setInterval(
    aggiornaCountdown,
    1000
);

</script>

</body>
</html>
