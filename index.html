<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background-color: rgb(170, 237, 171);

        font-family: Arial, sans-serif;

        overflow: hidden;
    }


    /* =========================================
       AREA SUPERIORE
       ========================================= */

    #countdown-area {

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;

        height: 160px;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        text-align: center;

        z-index: 10;

        padding: 10px 20px;
    }


    /* =========================================
       FRASE
       ========================================= */

    #countdown-text {

        width: 100%;

        text-align: center;

        font-size: 36px;

        font-weight: bold;

        line-height: 1.2;

        margin: 0 0 8px 0;
    }


    /* =========================================
       COUNTDOWN
       ========================================= */

    #countdown {

        width: 100%;

        text-align: center;

        font-size: 42px;

        font-weight: bold;

        line-height: 1;

        white-space: nowrap;
    }


    /* =========================================
       FINESTRA DEL GIOCO
       ========================================= */

    #game-container {

        position: fixed;

        top: 180px;

        left: 5%;

        width: 90%;

        height: calc(100vh - 200px);

        background: white;

        border-radius: 15px;

        overflow: hidden;

        box-shadow:
            0 5px 25px rgba(0,0,0,0.15);
    }


    #game {

        width: 100%;

        height: 100%;

        border: none;

        display: block;
    }


    /* =========================================
       IMMAGINE FINALE
       ========================================= */

    #final-image {

        display: none;

        position: fixed;

        inset: 0;

        width: 100vw;

        height: 100vh;

        background: black;

        justify-content: center;

        align-items: center;

        z-index: 100;
    }


    #final-image img {

        width: 100%;

        height: 100%;

        object-fit: contain;
    }


    /* =========================================
       SMARTPHONE VERTICALE
       ========================================= */

    @media (max-width: 600px) and (orientation: portrait) {

        #countdown-area {

            height: 125px;

            padding: 8px 10px;
        }


        #countdown-text {

            font-size: 22px;

            line-height: 1.2;

            margin-bottom: 8px;
        }


        #countdown {

            font-size: 34px;
        }


        #game-container {

            top: 140px;

            left: 2%;

            width: 96%;

            height: calc(100vh - 150px);

            border-radius: 10px;
        }
    }


    /* =========================================
       SMARTPHONE ORIZZONTALE
       ========================================= */

    @media (max-width: 900px) and (orientation: landscape) {

        #countdown-area {

            height: 95px;

            padding: 5px 15px;
        }


        #countdown-text {

            font-size: 22px;

            margin-bottom: 4px;
        }


        #countdown {

            font-size: 30px;
        }


        #game-container {

            top: 105px;

            left: 2%;

            width: 96%;

            height: calc(100vh - 115px);

            border-radius: 10px;
        }
    }


    /* =========================================
       SCHERMI MOLTO PICCOLI
       ========================================= */

    @media (max-width: 380px) {

        #countdown-text {

            font-size: 19px;
        }


        #countdown {

            font-size: 30px;
        }
    }

</style>

</head>


<body>


<!-- =========================================
     COUNTDOWN
     ========================================= -->

<div id="countdown-area">

    <div id="countdown-text">
        Al tuo regalo mancano ancora...
    </div>

    <div id="countdown">
        00:00:00
    </div>

</div>


<!-- =========================================
     GIOCO
     ========================================= -->

<div id="game-container">

    <iframe
        id="game"
        src="https://typeling1578.github.io/dino-game/"
        allow="fullscreen">
    </iframe>

</div>


<!-- =========================================
     IMMAGINE FINALE
     ========================================= -->

<div id="final-image">

    <img
        id="final-img"
        src="immagine_falsa.jpg"
        alt="">

</div>


<script>


/* =========================================
   DATA E ORA DELLA SORPRESA
   ========================================= */

const dataFinale =
    "2026-09-07T20:15:00+02:00";


/* =========================================
   ELEMENTI
   ========================================= */

const countdown =
    document.getElementById("countdown");

const countdownArea =
    document.getElementById("countdown-area");

const gameContainer =
    document.getElementById("game-container");

const finalImage =
    document.getElementById("final-image");

const finalImg =
    document.getElementById("final-img");


/* =========================================
   DATA FINALE
   ========================================= */

const target =
    new Date(dataFinale).getTime();


/* =========================================
   TIMER
   ========================================= */

let timer;


/* =========================================
   FUNZIONE COUNTDOWN
   ========================================= */

function aggiornaCountdown() {

    const adesso = Date.now();

    const differenza =
        target - adesso;


    /* =====================================
       COUNTDOWN TERMINATO
       ===================================== */

    if (differenza <= 0) {

        /* Nasconde countdown */

        countdownArea.style.display = "none";


        /* Nasconde gioco */

        gameContainer.style.display = "none";


        /* Mostra immagine falsa */

        finalImg.src =
            "immagine_falsa.jpg";

        finalImage.style.display =
            "flex";


        /*
           Dopo 3 secondi mostra
           l'immagine vera.
        */

        setTimeout(function() {

            finalImg.src =
                "immagine.jpg";

        }, 3000);


        /* Ferma il countdown */

        if (timer) {

            clearInterval(timer);

        }

        return;
    }


    /* =====================================
       CALCOLO DEL TEMPO
       ===================================== */

    const ore =
        Math.floor(
            differenza / 3600000
        );


    const minuti =
        Math.floor(
            (differenza % 3600000) / 60000
        );


    const secondi =
        Math.floor(
            (differenza % 60000) / 1000
        );


    /* =====================================
       VISUALIZZAZIONE
       ===================================== */

    countdown.textContent =

        String(ore).padStart(2, "0") + ":" +

        String(minuti).padStart(2, "0") + ":" +

        String(secondi).padStart(2, "0");

}


/* =========================================
   AVVIO
   ========================================= */

aggiornaCountdown();


timer =
    setInterval(
        aggiornaCountdown,
        1000
    );


</script>


</body>
</html>
