<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background-color: rgb(170, 237, 171);
        font-family: Arial, sans-serif;
        overflow: hidden;
    }


    /* ================================
       AREA COUNTDOWN
       ================================ */

    #countdown-area {
        position: fixed;

        top: 10px;
        left: 5%;
        width: 90%;

        height: 60px;

        display: flex;
        align-items: center;
        justify-content: center;

        z-index: 10;
    }


    /* FRASE SOPRA / ACCANTO AL COUNTDOWN */

    #countdown-text {
        position: fixed;

        top: 10px;
        left: 5%;
        width: 90%;

        height: 60px;

        display: flex;
        align-items: center;
        justify-content: center;

        z-index: 10;
        font-size: 36px;
        font-weight: bold;
	top: 10px;

        margin-right: 15px;

        text-align: right;
    }


    /* COUNTDOWN */

    #countdown {
        position: fixed;

        top: 80px;
        left: 5%;
        width: 90%;

        height: 60px;

        display: flex;
        align-items: center;
        justify-content: center;

        z-index: 10;
        font-size: 38px;
        font-weight: bold;

        white-space: nowrap;
    }


    /* ================================
       FINESTRA DEL GIOCO
       ================================ */

    #game-container {
        position: fixed;

        top: 180px;
        left: 5%;

        width: 90%;
        height: calc(100vh - 100px);

        background: white;

        border-radius: 15px;

        overflow: hidden;

        box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }


    #game {
        width: 100%;
        height: 100%;

        border: none;
    }


    /* ================================
       IMMAGINE FINALE
       ================================ */

    #final-image {
        display: none;

        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        background: black;

        justify-content: center;
        align-items: center;

        z-index: 100;
    }


    #final-image img {
        max-width: 100%;
        max-height: 100%;

        object-fit: contain;
    }

</style>
</head>


<body>


<!-- ================================
     COUNTDOWN
     ================================ -->

<div id="countdown-area">

    <div id="countdown-text">
        Al tuo regalo mancano ancora...
    </div>

    <div id="countdown">
        00:00:00
    </div>


</div>


<!-- ================================
     GIOCO
     ================================ -->

<div id="game-container">

    <iframe
        id="game"
        src="https://typeling1578.github.io/dino-game/"
        allow="fullscreen">
    </iframe>

</div>


<!-- ================================
     IMMAGINE FINALE
     ================================ -->

<div id="final-image">

    <img
        id="final-img"
        src="immagine_falsa.jpg"
        alt="">

</div>


<script>


/* =================================
   DATA E ORA DELLA SORPRESA
   ================================= */

const dataFinale = "2026-09-07T18:22:40+02:00";


/* =================================
   ELEMENTI
   ================================= */

const countdown =
    document.getElementById("countdown");

const countdownArea =
    document.getElementById("countdown-area");

const gameContainer =
    document.getElementById("game-container");

const finalImage =
    document.getElementById("final-image");

const finalImg =
    document.getElementById("final-img");


/* =================================
   DATA FINALE
   ================================= */

const target =
    new Date(dataFinale).getTime();


/* =================================
   FUNZIONE COUNTDOWN
   ================================= */

function aggiornaCountdown() {

    const adesso = Date.now();

    const differenza =
        target - adesso;


    /* ================================
       COUNTDOWN TERMINATO
       ================================ */

    if (differenza <= 0) {

        /* Nascondi countdown */

        countdownArea.style.display = "none";


        /* Nascondi gioco */

        gameContainer.style.display = "none";


        /* Mostra la FALSA immagine */

        finalImg.src =
            "immagine_falsa.jpg";

        finalImage.style.display =
            "flex";


        /* ================================
           DOPO 10 SECONDI
           MOSTRA LA VERA IMMAGINE
           ================================ */

        setTimeout(function() {

            finalImg.src =
                "immagine.jpg";

        }, 4000);


        /* Ferma il countdown */

        clearInterval(timer);

        return;
    }


    /* =================================
       CALCOLO TEMPO
       ================================= */

    const ore =
        Math.floor(
            differenza / 3600000
        );


    const minuti =
        Math.floor(
            (differenza % 3600000) / 60000
        );


    const secondi =
        Math.floor(
            (differenza % 60000) / 1000
        );


    /* =================================
       VISUALIZZAZIONE
       ================================= */

    countdown.textContent =
        String(ore).padStart(2, "0") + ":" +
        String(minuti).padStart(2, "0") + ":" +
        String(secondi).padStart(2, "0");

}


/* =================================
   AVVIO
   ================================= */

aggiornaCountdown();


const timer =
    setInterval(
        aggiornaCountdown,
        1000
    );


</script>

</body>
</html>
